name: Sync Upstream

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 时间 0:00 (北京时间 8:00) 自动检查更新
  workflow_dispatch:      # 允许手动点击按钮触发同步

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and sync
        id: sync
        run: |
          git remote add upstream https://github.com/hkfires/AIStudioBuildWS.git || true
          git fetch upstream main

          # 检查是否有新的提交
          LOCAL=$(git rev-parse HEAD)
          UPSTREAM=$(git rev-parse upstream/main)

          if [ "$LOCAL" = "$UPSTREAM" ]; then
            echo "already_up_to_date=true" >> $GITHUB_OUTPUT
            echo "✅ Already up to date"
          else
            echo "already_up_to_date=false" >> $GITHUB_OUTPUT
            echo "🔄 New commits detected, merging..."
            git merge upstream/main --no-edit
            git push origin main
          fi

      - name: Trigger Docker Build
        if: steps.sync.outputs.already_up_to_date == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'docker.yaml',
              ref: 'main'
            })
            console.log('🚀 Triggered Docker build workflow')
